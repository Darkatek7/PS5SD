<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5SD</title>
<!--
  The page sd-server serves on the PS5 (embedded into ps5sd.elf; see
  scripts/embed-file.sh and the SD_SERVER_EMBED_INDEX CMake option).
  Plain ES5 and XMLHttpRequest, one file and no external requests, because the
  PS5 browser renders modern bundles blank: no modules, no arrow functions, no
  let/const, no fetch, no CSS grid. Flexbox, sized from the viewport, so it
  works with a DualSense cursor on a TV (large controls, a white focus frame)
  and on a phone.

  Talks to:
    GET  /sdapi/v1/sd-models  /sdapi/v1/samplers  /sdapi/v1/schedulers  /v1/models
    GET  /sdcpp/v1/capabilities                  (defaults, and "is async available")
    POST /sdcpp/v1/img_gen, GET /sdcpp/v1/jobs/<id>, POST .../cancel   (async, with previews)
    POST /sdapi/v1/txt2img + GET /sdapi/v1/progress                    (fallback: synchronous)
    GET  /sdapi/v1/progress                                            (health, every few seconds)
    GET  /ps5sd/v1/gallery, /ps5sd/v1/gallery/<file>                   (saved images, --output-dir)
  SPDX-License-Identifier: MIT
-->
<style>
  :root {
    --bg: #0a0d14; --surface: #121826; --raised: #1a2336; --field: #0b101b;
    --border: #26314a; --text: #f4f7fb; --body: #dbe3f0; --muted: #a3b2c9; --faint: #8493ac;
    --accent: #0070d1; --accent-hi: #2d8ff0; --ok: #5fd38d; --bad: #ff8f8f; --warn: #f5c26b;
  }
  html { font-size: 20px; font-size: clamp(17px, 1.3vw, 26px); -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--body);
    font-family: "SST", "SST Roman", "SST-Roman", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
  body { background: var(--bg) linear-gradient(180deg, #0f1a30 0, var(--bg) 24rem) no-repeat; min-height: 100vh; }
  a { color: var(--accent-hi); text-decoration: none; }
  /* The PS5's own focus: a white frame around what the cursor is on. Kept
     apart from :focus-visible, since a browser that does not know it drops
     the whole rule, frame included. */
  button:focus, input:focus, select:focus, textarea:focus, a:focus { outline: 3px solid #fff; outline-offset: 3px; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .top { display: flex; align-items: center; min-height: 4rem; padding: 0 2rem; }
  .logo { width: 1.1rem; height: 1.1rem; border-radius: 0.3rem; background: var(--accent); margin-right: 0.7rem;
    box-shadow: 0 0 1.2rem rgba(45, 143, 240, 0.7); }
  .brand { color: var(--text); font-size: 1.25rem; font-weight: 600; letter-spacing: 0.04em; margin-right: 1.25rem; }
  .model { color: var(--muted); font-size: 0.95rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: flex; align-items: center; font-size: 0.875rem; color: var(--faint); background: var(--surface);
    border: 1px solid var(--border); border-radius: 2rem; padding: 0.2rem 1rem 0.2rem 0.8rem; margin-left: 1rem; white-space: nowrap; }
  .pill .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--faint); margin-right: 0.55rem; }
  .pill.on { color: var(--ok); } .pill.on .dot { background: var(--ok); }
  .pill.off { color: var(--bad); } .pill.off .dot { background: var(--bad); }
  .pill.work { color: var(--accent-hi); } .pill.work .dot { background: var(--accent-hi); }
  .pill.busy { color: var(--warn); } .pill.busy .dot { background: var(--warn); }

  .tabs { max-width: 90rem; margin: 0 auto; padding: 0.25rem 2rem 0; display: flex; }
  .tabs button { font-size: 1.05rem; min-height: 3rem; padding: 0 1.6rem; margin-right: 0.6rem; border-radius: 2rem;
    background: transparent; color: var(--muted); border: 1px solid transparent; }
  .tabs button:hover { color: var(--text); background: var(--surface); }
  .tabs button.on { color: #fff; background: var(--accent); }

  .main { display: flex; flex-wrap: wrap; align-items: flex-start; max-width: 90rem; margin: 0 auto; padding: 0.5rem 1.25rem 2rem; }
  .panel { box-sizing: border-box; margin: 0.75rem; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.5rem; }
  .controls { flex: 1 1 26rem; min-width: 0; }
  .result { flex: 1.5 1 28rem; min-width: 0; }

  label, .lbl { display: block; color: var(--muted); font-size: 0.875rem; margin: 1.1rem 0 0.4rem; }
  label:first-child { margin-top: 0; }
  .row label:first-child, .row .lbl:first-child { margin-top: 1.1rem; }
  textarea, input, select { box-sizing: border-box; width: 100%; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.95rem; }
  textarea { display: block; resize: vertical; min-height: 5.5rem; }
  textarea.big { font-size: 1.15rem; min-height: 9rem; line-height: 1.45; }
  select { height: 3.25rem; }
  input { height: 3.25rem; }
  textarea::placeholder, input::placeholder { color: var(--faint); }

  button { font: inherit; font-size: 1rem; color: var(--text); background: var(--raised); border: 1px solid var(--border);
    border-radius: 10px; min-height: 3.25rem; padding: 0 1.2rem; cursor: pointer; }
  button:hover { background: #222e47; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.go { flex: 1; min-height: 4.25rem; font-size: 1.3rem; font-weight: 600; color: #fff; letter-spacing: 0.02em;
    background: var(--accent); border: 0; border-radius: 14px; }
  button.go:hover { background: var(--accent-hi); }
  button.go:disabled { background: #2a3a55; color: #8c9bb4; opacity: 1; }
  .gorow { display: flex; margin-top: 1.1rem; }
  .gorow .alt { flex: none; min-height: 4.25rem; margin-left: 0.7rem; border-radius: 14px; }

  .setbar { display: flex; align-items: center; margin-top: 1.1rem; }
  .setbar button { flex: none; background: transparent; }
  .setbar .sum { color: var(--faint); font-size: 0.875rem; margin-left: 0.9rem; min-width: 0; }
  #settings { border-top: 1px solid var(--border); margin-top: 0.9rem; padding-top: 0.4rem; }
  .presets { display: flex; flex-wrap: wrap; margin: 0 -0.25rem; }
  .presets button { margin: 0.25rem; min-height: 2.75rem; padding: 0 0.9rem; font-size: 0.9rem; }
  .row { display: flex; flex-wrap: wrap; margin: 0 -0.5rem; }
  .row > div { flex: 1 1 11rem; min-width: 0; margin: 0 0.5rem; }
  .step { display: flex; }
  .step button { width: 3.25rem; padding: 0; flex: none; font-size: 1.3rem; }
  .step input { text-align: center; margin: 0 0.3rem; min-width: 0; }
  .seed { display: flex; }
  .seed input { margin-right: 0.4rem; min-width: 0; }
  .seed button { flex: none; }
  .hint { color: var(--faint); font-size: 0.8125rem; margin: 0.5rem 0 0; }
  .hint button { min-height: 2.5rem; margin-left: 0.5rem; font-size: 0.85rem; padding: 0 0.9rem; }

  .state { display: flex; align-items: baseline; }
  #status { color: var(--text); font-size: 1.3rem; font-weight: 500; flex: 1; min-width: 0; min-height: 1.9rem; }
  #status.error { color: var(--bad); }
  #sub { color: var(--muted); font-size: 0.9rem; min-height: 1.4rem; }
  .bar { height: 0.55rem; background: var(--field); border-radius: 0.3rem; margin: 0.7rem 0 1rem; overflow: hidden; position: relative; }
  .bar div { height: 100%; width: 0%; background: var(--accent-hi); border-radius: 0.3rem; }
  .bar.ind div { width: 30% !important; position: absolute; left: 0; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }
  .stage { display: flex; align-items: center; justify-content: center; min-height: 20rem; background: var(--field);
    border: 1px solid var(--border); border-radius: 12px; padding: 0.5rem; text-align: center; }
  .stage img { display: block; max-width: 100%; max-height: 78vh; width: auto; height: auto; border-radius: 6px; }
  .stage .empty { color: var(--faint); padding: 3rem 1rem; font-size: 1.05rem; }
  .actions { margin-top: 1rem; min-height: 3.25rem; display: flex; flex-wrap: wrap; }
  .actions a, .actions button { display: block; margin: 0 0.6rem 0.6rem 0; padding: 0 1.3rem; min-height: 3.25rem; line-height: 3.25rem;
    background: var(--raised); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; }
  .actions button { line-height: normal; }
  .actions a:hover { background: #222e47; }
  #cancel { flex: none; margin-left: 1rem; min-height: 2.75rem; }

  .gal { max-width: 90rem; margin: 0 auto; padding: 0.5rem 2rem 3rem; }
  .galbar { display: flex; align-items: center; margin-bottom: 0.75rem; }
  .galbar h2 { flex: 1; color: var(--text); font-size: 1.3rem; font-weight: 500; margin: 0; }
  .thumbs { display: flex; flex-wrap: wrap; margin: 0 -0.4rem; }
  .thumbs .t { box-sizing: border-box; flex: 0 0 16.666%; padding: 0.4rem; }
  .thumbs a { display: block; position: relative; padding-bottom: 100%; background: var(--field);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .thumbs img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .gal .none { color: var(--faint); padding: 2rem 0; }
  .more { text-align: center; margin-top: 1rem; }
  .foot { text-align: center; color: var(--faint); font-size: 0.8125rem; padding: 0 1rem 2rem; }

  .lb { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10; background: #05080e; flex-direction: column; }
  .lb-bar { display: flex; align-items: center; padding: 0.75rem 1.25rem; }
  .lb-title { flex: 1; min-width: 0; color: var(--muted); font-size: 0.95rem; }
  .lb-bar a, .lb-bar button { flex: none; margin-left: 0.6rem; min-height: 3.25rem; line-height: 3.25rem; padding: 0 1.3rem; background: var(--raised);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
  .lb-bar button { line-height: normal; }
  .lb-body { flex: 1; min-height: 0; display: flex; align-items: center; padding: 0 1rem 1rem; }
  .lb-body .nav { flex: none; width: 4.5rem; height: 6rem; font-size: 2.4rem; padding: 0; border-radius: 14px; }
  .lb-img { flex: 1; min-width: 0; text-align: center; }
  .lb-img img { max-width: 100%; height: calc(100vh - 8rem); object-fit: contain; border-radius: 6px; }

  #toast { position: fixed; left: 50%; bottom: 2rem; z-index: 20; display: none; max-width: 90%; background: var(--raised);
    border: 1px solid var(--accent-hi); color: var(--text); border-radius: 2rem; padding: 0.7rem 1.6rem; transform: translateX(-50%); }

  @media (max-width: 1300px) { .thumbs .t { flex-basis: 25%; } }
  @media (max-width: 900px) { .thumbs .t { flex-basis: 33.333%; } }
  @media (max-width: 720px) {
    html { font-size: 17px; }
    .top { padding: 0 1rem; flex-wrap: wrap; padding-top: 0.5rem; padding-bottom: 0.25rem; }
    .model { order: 3; flex-basis: 100%; margin-top: 0.1rem; }
    .pill { margin-left: auto; }
    .tabs { padding: 0.25rem 1rem 0; }
    .tabs button { flex: 1; margin-right: 0.4rem; }
    .panel { margin: 0.5rem 0; padding: 1.1rem; }
    .main { padding: 0.25rem 0.75rem 1.5rem; }
    .gal { padding: 0.5rem 0.75rem 2rem; }
    .stage { min-height: 12rem; }
    .state { display: block; }
    #cancel { margin: 0.5rem 0 0; width: 100%; }
    .gorow .alt { display: none; }
    .lb-bar { flex-wrap: wrap; }
    .lb-title { flex-basis: 100%; margin-bottom: 0.5rem; }
    .lb-bar a, .lb-bar button { flex: 1; margin: 0 0.3rem 0 0; text-align: center; padding: 0; }
    .lb-body .nav { width: 2.6rem; height: 5rem; }
  }
  @media (max-width: 520px) { .thumbs .t { flex-basis: 50%; } }
</style>
</head>
<body>
<header class="top">
  <span class="logo"></span>
  <span class="brand">PS5SD</span>
  <span class="model" id="model">connecting&hellip;</span>
  <span class="pill off" id="pill"><span class="dot"></span><span id="pilltext">offline</span></span>
</header>
<nav class="tabs">
  <button type="button" class="on" id="tab-create">Create</button>
  <button type="button" id="tab-gallery">Gallery <span id="gcount"></span></button>
</nav>

<div class="main" id="view-create">
  <section class="panel controls">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" class="big" rows="5" placeholder="What should it draw?"></textarea>

    <div class="gorow">
      <button type="button" class="go" id="go">Generate</button>
      <button type="button" class="alt" id="surprise">Surprise me</button>
    </div>

    <div class="setbar">
      <button type="button" id="set-toggle" aria-expanded="false" aria-controls="settings">Settings &#9662;</button>
      <span class="sum" id="summary"></span>
    </div>
    <div id="settings" style="display:none">
      <label for="neg">Negative prompt</label>
      <textarea id="neg" rows="2" placeholder="What to avoid (optional)"></textarea>

      <div class="lbl">Size</div>
      <div class="presets" id="presets"></div>
      <div class="row" style="margin-top:0.5rem">
        <div><label for="w">Width</label><input id="w" type="number" min="64" max="2048" step="64"></div>
        <div><label for="h">Height</label><input id="h" type="number" min="64" max="2048" step="64"></div>
      </div>

      <div class="row">
        <div>
          <div class="lbl">Steps</div>
          <div class="step"><button type="button" id="steps-">&minus;</button><input id="steps" type="number" min="1" max="150" step="1"><button type="button" id="steps+">+</button></div>
        </div>
        <div>
          <div class="lbl">CFG scale</div>
          <div class="step"><button type="button" id="cfg-">&minus;</button><input id="cfg" type="number" min="0" max="30" step="0.5"><button type="button" id="cfg+">+</button></div>
        </div>
      </div>

      <div class="row">
        <div><label for="sampler">Sampler</label><select id="sampler"><option value="default">default</option></select></div>
        <div><label for="scheduler">Scheduler</label><select id="scheduler"><option value="default">default</option></select></div>
      </div>

      <label for="seed">Seed</label>
      <div class="seed"><input id="seed" type="number" step="1" value="-1"><button type="button" id="rnd">Random</button></div>
      <p class="hint">-1 picks a random seed. One image per run.</p>
      <p class="hint"><span id="presetnote"></span><button type="button" id="resetpreset">Use preset</button></p>
    </div>
  </section>

  <section class="panel result">
    <div class="state">
      <div id="status">Ready.</div>
      <button type="button" id="cancel" style="display:none">Cancel</button>
    </div>
    <div id="sub"></div>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div class="stage" id="stage"><div class="empty">Your image appears here.</div></div>
    <div class="actions" id="actions"></div>
  </section>
</div>

<section class="gal" id="view-gallery" style="display:none">
  <div class="galbar">
    <h2>Gallery</h2>
    <button type="button" id="refresh">Refresh</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
  <div class="none" id="none">Nothing saved yet.</div>
  <div class="more"><button type="button" id="more" style="display:none">Show more</button></div>
</section>

<div class="foot">stable-diffusion.cpp on PlayStation 5</div>

<div class="lb" id="lb" style="display:none" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-bar">
    <span class="lb-title" id="lb-title"></span>
    <a id="lb-dl" href="#">Download</a>
    <a id="lb-open" href="#" target="_blank">Open full size</a>
    <button type="button" id="lb-close">Close</button>
  </div>
  <div class="lb-body">
    <button type="button" class="nav" id="lb-prev" aria-label="Newer">&lsaquo;</button>
    <div class="lb-img"><img id="lb-img" alt=""></div>
    <button type="button" class="nav" id="lb-next" aria-label="Older">&rsaquo;</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  var PRESETS = [[512, 512], [512, 768], [768, 512], [640, 640], [768, 768], [768, 1024], [1024, 768], [1024, 1024]];
  var PAGE = 24;
  var SURPRISE = [
    'a lighthouse on a rocky coast at dusk, dramatic clouds, oil painting',
    'a red fox sleeping in a snowy forest, soft morning light',
    'a cozy cabin in the mountains, warm window light, starry sky',
    'a futuristic city at night, neon reflections on wet streets',
    'a astronaut riding a horse on mars, cinematic',
    'a bowl of ramen, steam rising, studio photo, shallow depth of field',
    'a tiny robot watering flowers in a greenhouse, watercolor',
    'a sailing ship inside a glass bottle on a wooden desk',
    'an ancient temple overgrown with jungle, golden hour'
  ];
  var $ = function (id) { return document.getElementById(id); };

  var st = {
    useJobs: false,      // /sdcpp/v1/img_gen is available (job polling with previews)
    canCancelGen: false, // the server can stop a job that is already generating
    busy: false,
    online: false,
    offFails: 0,
    others: false,       // the server is busy with someone else's job
    infoBusy: false,
    resumed: false,
    job: null,           // id of the async job being watched
    token: 0,            // bumps when a run is over, so late replies are ignored
    t0: 0,               // when the run started (ms)
    seed: 0,
    fails: 0,
    limit: PAGE,
    sub: '',
    model: null,         // name of the loaded model (null = not asked yet)
    preset: null,
    last: null,          // settings of the last finished image
    known: null,         // gallery names before the current run
    lb: -1
  };

  // ---------- small helpers ----------
  function save(key, value) { try { localStorage.setItem('ps5sd.' + key, String(value)); } catch (e) {} }
  function load(key) { try { return localStorage.getItem('ps5sd.' + key); } catch (e) { return null; } }
  function drop(key) { try { localStorage.removeItem('ps5sd.' + key); } catch (e) {} }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function text(node, value) { node.textContent = value; }
  function show(id, on, how) { $(id).style.display = on ? (how || 'block') : 'none'; }

  function req(method, url, body, cb, timeout) {
    var x = new XMLHttpRequest();
    var done = false;
    function finish(code, data) {
      if (done) return;
      done = true;
      cb(code, data);
    }
    x.open(method, url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var data = null;
      try { data = JSON.parse(x.responseText); } catch (e) {}
      finish(x.status, data);
    };
    x.onerror = function () { finish(0, null); };
    x.ontimeout = function () { finish(0, null); };
    try { x.timeout = timeout || 0; } catch (e) {}
    if (body !== null && body !== undefined) {
      x.setRequestHeader('Content-Type', 'application/json');
      x.send(JSON.stringify(body));
    } else {
      x.send();
    }
  }

  var toastTimer = 0;
  function toast(message) {
    var t = $('toast');
    text(t, message);
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2500);
  }

  function setPill() {
    var cls = 'off', label = 'offline';
    if (st.online) {
      if (st.busy) { cls = 'work'; label = 'generating'; }
      else if (st.others) { cls = 'busy'; label = 'busy'; }
      else { cls = 'on'; label = 'online'; }
    }
    $('pill').className = 'pill ' + cls;
    text($('pilltext'), label);
  }

  function setOnline(on) {
    var was = st.online;
    st.online = on;
    if (on) st.offFails = 0;
    setPill();
    if (on && !was) loadInfo();
    if (!on && st.model === null) text($('model'), 'server not reachable');
  }

  function num(id, fallback, min, max) {
    var v = parseFloat($(id).value);
    if (isNaN(v)) v = fallback;
    if (v < min) v = min;
    if (v > max) v = max;
    return v;
  }

  function size8(id, fallback) {
    var v = Math.round(num(id, fallback, 64, 2048) / 8) * 8;
    $(id).value = v;
    return v;
  }

  function clock(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    var m = Math.floor(seconds / 60), s = seconds % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function mime(b64) { return b64.indexOf('/9j/') === 0 ? 'image/jpeg' : 'image/png'; }
  function dataUrl(b64) { return 'data:' + mime(b64) + ';base64,' + b64; }

  // ---------- model presets ----------
  function mkPreset(label, w, steps, cfg, sampler) {
    return { label: label, w: w, h: w, steps: steps, cfg: cfg, sampler: sampler || 'default', scheduler: 'default' };
  }

  function pickPreset(name) {
    var n = (name || '').toLowerCase();
    var xl = /xl|pony|juggernaut/.test(n);
    if (/sdxs/.test(n)) return mkPreset('SDXS', 512, 1, 1);
    if (/turbo/.test(n)) return mkPreset(xl ? 'SDXL Turbo' : 'SD Turbo', 512, 1, 1);
    if (/lightning|hyper/.test(n)) return mkPreset('Lightning', xl ? 1024 : 512, 4, 1);
    if (/lcm/.test(n)) return mkPreset('LCM', xl ? 1024 : 512, 4, 1.5, 'lcm');
    if (/flux/.test(n)) return mkPreset('Flux', 1024, /schnell/.test(n) ? 4 : 20, 1);
    if (/sd3|sd_3|stable-diffusion-3/.test(n)) return mkPreset('SD3', 1024, 28, 4.5);
    if (xl) return mkPreset('SDXL', 1024, 25, 6);
    return mkPreset('SD 1.x', 512, 20, 7);
  }

  function presetNote(p) {
    return 'Preset for this model (' + p.label + '): ' + p.steps + (p.steps === 1 ? ' step' : ' steps') + ', CFG ' + p.cfg + ', ' + p.w + '×' + p.h + '.';
  }

  // ---------- form <-> settings ----------
  function getForm() {
    return {
      w: size8('w', 512), h: size8('h', 512),
      steps: Math.round(num('steps', 20, 1, 150)), cfg: num('cfg', 7, 0, 30),
      sampler: $('sampler').value, scheduler: $('scheduler').value,
      seed: parseInt($('seed').value, 10)
    };
  }

  function setSelect(id, value) {
    var sel = $(id);
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === value) { sel.value = value; return; }
    }
    sel.value = 'default';
  }

  function setForm(o) {
    if (o.w) $('w').value = o.w;
    if (o.h) $('h').value = o.h;
    if (o.steps) $('steps').value = o.steps;
    if (o.cfg !== undefined && o.cfg !== null) $('cfg').value = o.cfg;
    setSelect('sampler', o.sampler || 'default');
    setSelect('scheduler', o.scheduler || 'default');
    if (o.seed !== undefined && o.seed !== null && !isNaN(o.seed)) $('seed').value = o.seed;
    markPreset();
    summary();
  }

  function persist() {
    save('prompt', $('prompt').value);
    save('neg', $('neg').value);
    save('set.' + (st.model || '_'), JSON.stringify(getForm()));
    summary();
  }

  function summary() {
    var seed = parseInt($('seed').value, 10);
    var steps = Math.round(num('steps', 20, 1, 150));
    text($('summary'), parseInt($('w').value, 10) + '×' + parseInt($('h').value, 10) + ' · ' + steps +
      (steps === 1 ? ' step' : ' steps') + ' · CFG ' + num('cfg', 7, 0, 30) +
      ' · seed ' + (isNaN(seed) || seed < 0 ? 'random' : seed));
  }

  function applyModel(name) {
    var changed = name !== st.model;
    st.model = name;
    st.preset = pickPreset(name);
    text($('presetnote'), presetNote(st.preset));
    if (!changed) return;
    var saved = null;
    try { saved = JSON.parse(load('set.' + (name || '_'))); } catch (e) {}
    var keep = parseInt($('seed').value, 10);
    var form = saved || st.preset;
    setForm(form);
    if (!saved && !isNaN(keep)) $('seed').value = keep;
    summary();
  }

  // ---------- result panel ----------
  function status(message, isError) {
    var el = $('status');
    text(el, message);
    el.className = isError ? 'error' : '';
  }

  function progress(fraction) {
    $('fill').style.width = Math.max(0, Math.min(100, Math.round(fraction * 100))) + '%';
    $('bar').className = 'bar' + (st.busy && fraction <= 0 ? ' ind' : '');
  }

  function showImage(src, label) {
    var stage = $('stage');
    var img = stage.getElementsByTagName('img')[0];
    if (!img) {
      clear(stage);
      img = document.createElement('img');
      stage.appendChild(img);
    }
    img.alt = label || 'generated image';
    img.src = src;
  }

  function link(href, label, name, blank) {
    var a = document.createElement('a');
    a.href = href;
    if (name) a.setAttribute('download', name);
    if (blank) a.target = '_blank';
    text(a, label);
    return a;
  }

  function actionButton(label, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    text(b, label);
    b.onclick = fn;
    return b;
  }

  function showActions(href, name, openHref, withParams) {
    var box = $('actions');
    clear(box);
    if (!href) return;
    box.appendChild(link(href, 'Download', name, false));
    if (openHref) box.appendChild(link(openHref, 'Open full size', null, true));
    if (withParams && st.last) {
      box.appendChild(actionButton('Use seed ' + st.last.seed, function () {
        $('seed').value = st.last.seed; persist(); toast('Seed ' + st.last.seed + ' is set. Open Settings to see it.');
      }));
      box.appendChild(actionButton('Run again', function () {
        setForm(st.last); $('prompt').value = st.last.prompt; $('neg').value = st.last.negative; generate();
      }));
    }
  }

  // ---------- run state ----------
  function setBusy(busy) {
    st.busy = busy;
    $('go').disabled = busy;
    text($('go'), busy ? 'Generating…' : 'Generate');
    show('cancel', busy, 'block');
    text($('cancel'), 'Cancel');
    setPill();
  }

  function tick() {
    if (!st.busy) return;
    var elapsed = (new Date().getTime() - st.t0) / 1000;
    text($('sub'), (st.sub ? st.sub + ' · ' : '') + clock(elapsed) + ' elapsed');
    setTimeout(tick, 1000);
  }

  function begin(job) {
    st.token++;
    st.job = job || null;
    st.fails = 0;
    st.sub = '';
    st.others = false;
    setBusy(true);
    progress(0);
    tick();
  }

  function end() {
    st.token++;
    st.job = null;
    drop('job');
    setBusy(false);
    progress(0);
  }

  function fail(message) {
    status(message, true);
    end();
    text($('sub'), '');
  }

  function succeed(b64, seed) {
    var seconds = (new Date().getTime() - st.t0) / 1000;
    var src = dataUrl(b64);
    showImage(src, 'generated image');
    end();
    progress(1);
    status('Done in ' + clock(seconds));
    var l = st.last;
    text($('sub'), l ? l.w + '×' + l.h + ' · ' + l.steps + (l.steps === 1 ? ' step' : ' steps') + ' · CFG ' + l.cfg + ' · seed ' + seed : 'seed ' + seed);
    showActions(src, 'sd_' + seed + '.png', null, true);
    // the server saved it (with --output-dir): download that file instead of a huge data URL
    var known = st.known;
    loadGallery(function (list) {
      if (!known || !list) return;
      for (var i = 0; i < list.length; i++) {
        if (!known[list[i].name]) {
          if (!st.busy) showActions(list[i].url, list[i].name, list[i].url, true);
          return;
        }
      }
    });
  }

  // ---------- generation ----------
  function readParams() {
    var f = getForm();
    if (isNaN(f.seed) || f.seed < 0) f.seed = Math.floor(Math.random() * 2147483647);
    f.prompt = $('prompt').value;
    f.negative = $('neg').value;
    return f;
  }

  function generate() {
    if (st.busy) return;
    var p = readParams();
    if (!p.prompt.replace(/^\s+|\s+$/g, '')) {
      status('Type a prompt first.', true);
      $('prompt').focus();
      return;
    }
    persist();
    st.seed = p.seed;
    st.last = p;
    st.t0 = new Date().getTime();
    st.known = null;
    if (galleryLoaded) {
      st.known = {};
      for (var i = 0; i < galleryList.length; i++) st.known[galleryList[i].name] = true;
    }
    status('Sending…');
    showActions(null);
    if (window.innerWidth < 900) {
      try { $('stage').scrollIntoView(); } catch (e) {}
    }
    if (st.useJobs) startAsync(p); else startSync(p);
  }

  // Asynchronous: the server queues a job; we poll it once a second.
  function startAsync(p) {
    var body = {
      prompt: p.prompt,
      negative_prompt: p.negative,
      width: p.w,
      height: p.h,
      seed: p.seed,
      batch_count: 1,
      sample_params: { sample_steps: p.steps, guidance: { txt_cfg: p.cfg } },
      preview: 'proj',
      preview_interval: 1,
      output_format: 'png'
    };
    if (p.sampler !== 'default') body.sample_params.sample_method = p.sampler;
    if (p.scheduler !== 'default') body.sample_params.scheduler = p.scheduler;
    begin(null);
    var token = st.token;
    req('POST', '/sdcpp/v1/img_gen', body, function (code, data) {
      if (token !== st.token) return;
      if (code === 202 && data && data.id) {
        st.job = data.id;
        save('job', data.id + ' ' + st.t0 + ' ' + st.seed);
        status('Queued…');
        pollJob();
      } else if (code === 404 || code === 405 || code === 501) {
        // an older server without the job API
        st.useJobs = false;
        end();
        startSync(p);
      } else {
        setOnline(code !== 0);
        fail(code === 0 ? 'Cannot reach the server.' :
          'The server refused the request' + (data && data.error ? ': ' + (data.message || data.error) : ' (' + code + ').'));
      }
    });
  }

  function pollJob() {
    var token = st.token;
    var job = st.job;
    if (!job) return;
    req('GET', '/sdcpp/v1/jobs/' + job, null, function (code, data) {
      if (token !== st.token) return;
      if (code === 0) {
        st.fails++;
        st.online = false;
        setPill();
        if (st.fails > 300) { fail('Lost the connection to the server.'); return; }
        status('Connection lost, retrying…');
        setTimeout(pollJob, 1000);
        return;
      }
      st.fails = 0;
      if (!st.online) { st.online = true; setPill(); }
      if (code === 404 || code === 410) { fail('The server no longer has this job.'); return; }
      if (!data) { setTimeout(pollJob, 1000); return; }

      if (data.status === 'completed') {
        var images = data.result && data.result.images;
        if (images && images.length) succeed(images[0].b64_json, st.seed);
        else fail('The job finished without an image.');
        return;
      }
      if (data.status === 'failed' || data.status === 'cancelled') {
        fail(data.error && data.error.message ? data.error.message : (data.status === 'cancelled' ? 'Cancelled.' : 'Generation failed.'));
        return;
      }
      if (data.status === 'queued') {
        status(data.queue_position > 1 ? 'Queued, ' + (data.queue_position - 1) + ' ahead of you…' : 'Queued…');
        st.sub = '';
      } else {
        text($('cancel'), st.canCancelGen ? 'Cancel' : 'Stop waiting');
        var pv = data.preview;
        if (pv && pv.total_steps > 0) {
          status('Step ' + pv.step + ' of ' + pv.total_steps);
          progress(pv.step / pv.total_steps);
          st.sub = eta(pv.step, pv.total_steps);
          if (pv.b64_json) showImage(dataUrl(pv.b64_json), 'preview');
        } else {
          status('Generating…');
          st.sub = '';
        }
      }
      setTimeout(pollJob, 1000);
    });
  }

  function eta(step, steps) {
    if (step < 1 || step >= steps) return '';
    var elapsed = (new Date().getTime() - st.t0) / 1000;
    // the clock started before the first step (model warm-up), so this reads long early on
    return 'about ' + clock(elapsed / step * (steps - step)) + ' left';
  }

  // Synchronous (older servers): one long POST, progress from /sdapi/v1/progress.
  function startSync(p) {
    var task = 'ps5sd-' + new Date().getTime();
    var body = {
      id_task: task,
      prompt: p.prompt,
      negative_prompt: p.negative,
      width: p.w,
      height: p.h,
      steps: p.steps,
      cfg_scale: p.cfg,
      seed: p.seed,
      batch_size: 1
    };
    if (p.sampler !== 'default') body.sampler_name = p.sampler;
    if (p.scheduler !== 'default') body.scheduler = p.scheduler;
    begin(null);
    var token = st.token;
    status('Generating…');
    req('POST', '/sdapi/v1/txt2img', body, function (code, data) {
      if (token !== st.token) return;
      if (code === 200 && data && data.images && data.images.length) {
        succeed(data.images[0], st.seed);
      } else {
        setOnline(code !== 0);
        fail(code === 0 ? 'Lost the connection to the server.' :
          'Generation failed' + (data && (data.message || data.error) ? ': ' + (data.message || data.error) : ' (' + code + ').'));
      }
    });
    setTimeout(function () { pollProgress(token, task); }, 1000);
  }

  function pollProgress(token, task) {
    if (token !== st.token) return;
    req('GET', '/sdapi/v1/progress?id_task=' + encodeURIComponent(task), null, function (code, data) {
      if (token !== st.token) return;
      var state = data && data.state;
      if (state && state.sampling_steps > 0) {
        status('Step ' + state.sampling_step + ' of ' + state.sampling_steps);
        progress(data.progress || 0);
        st.sub = eta(state.sampling_step, state.sampling_steps);
        if (data.current_image) showImage(dataUrl(data.current_image), 'preview');
      }
      setTimeout(function () { pollProgress(token, task); }, 1000);
    });
  }

  function cancel() {
    if (!st.busy) return;
    var job = st.job;
    var queued = st.useJobs && job;
    end();
    text($('sub'), '');
    if (queued) {
      // A queued job is cancelled; one that is generating cannot always be interrupted,
      // so the page then stops waiting and the image still lands in the gallery.
      status('Cancelling…');
      req('POST', '/sdcpp/v1/jobs/' + job + '/cancel', {}, function (code) {
        if (code === 200) status('Cancelled.');
        else status('Stopped waiting. The server finishes this image; it will appear in the gallery.');
        setTimeout(refreshGallery, 2000);
      });
    } else {
      status('Stopped waiting. The server finishes this image.');
    }
  }

  // Back on the page while a job is still running on the server.
  function resume() {
    if (st.resumed) return;
    st.resumed = true;
    var saved = load('job');
    if (!saved) return;
    var parts = saved.split(' ');
    if (parts.length < 3) { drop('job'); return; }
    req('GET', '/sdcpp/v1/jobs/' + parts[0], null, function (code, data) {
      if (code !== 200 || !data) { drop('job'); return; }
      if (st.busy) return;
      st.t0 = parseInt(parts[1], 10) || new Date().getTime();
      st.seed = parts[2];
      if (data.status === 'completed' || data.status === 'queued' || data.status === 'generating') {
        begin(parts[0]);
        status('Back on a running job…');
        pollJob();
      } else {
        drop('job');
      }
    });
  }

  // ---------- controls ----------
  function buildPresets() {
    var box = $('presets');
    for (var i = 0; i < PRESETS.length; i++) {
      (function (w, h) {
        var b = document.createElement('button');
        b.type = 'button';
        b.id = 'p' + w + 'x' + h;
        text(b, w + '×' + h);
        b.onclick = function () { $('w').value = w; $('h').value = h; markPreset(); persist(); };
        box.appendChild(b);
      })(PRESETS[i][0], PRESETS[i][1]);
    }
  }

  function markPreset() {
    var w = parseInt($('w').value, 10), h = parseInt($('h').value, 10);
    for (var i = 0; i < PRESETS.length; i++) {
      var b = $('p' + PRESETS[i][0] + 'x' + PRESETS[i][1]);
      b.className = (PRESETS[i][0] === w && PRESETS[i][1] === h) ? 'on' : '';
    }
  }

  function stepper(id, delta, min, max, digits) {
    var input = $(id);
    var v = parseFloat(input.value);
    if (isNaN(v)) v = min;
    v = Math.min(max, Math.max(min, v + delta));
    input.value = digits ? v.toFixed(digits).replace(/\.0+$/, '') : Math.round(v);
    persist();
  }

  function fill(select, names) {
    var current = select.value;
    clear(select);
    var list = ['default'];
    for (var i = 0; i < names.length; i++) if (names[i] !== 'default') list.push(names[i]);
    for (var j = 0; j < list.length; j++) {
      var o = document.createElement('option');
      o.value = list[j];
      text(o, list[j]);
      select.appendChild(o);
    }
    select.value = 'default';
    for (var k = 0; k < list.length; k++) if (list[k] === current) select.value = current;
  }

  function names(data) {
    var out = [];
    if (data && data.length) {
      for (var i = 0; i < data.length; i++) {
        var n = typeof data[i] === 'string' ? data[i] : (data[i] && data[i].name);
        if (n) out.push(n);
      }
    }
    return out;
  }

  function toggleSettings() {
    var open = $('settings').style.display === 'none';
    show('settings', open);
    $('set-toggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    text($('set-toggle'), open ? 'Settings ▴' : 'Settings ▾');
    save('open', open ? '1' : '0');
  }

  function setView(name) {
    var gallery = name === 'gallery';
    show('view-create', !gallery, 'flex');
    show('view-gallery', gallery);
    $('tab-create').className = gallery ? '' : 'on';
    $('tab-gallery').className = gallery ? 'on' : '';
    if (gallery) refreshGallery();
  }

  // ---------- gallery ----------
  var galleryList = [];
  var galleryLoaded = false;
  var lbFrom = null;

  function loadGallery(cb) {
    req('GET', '/ps5sd/v1/gallery?limit=200', null, function (code, data) {
      if (code === 200 && data && data.length !== undefined) {
        galleryList = data;
        galleryLoaded = true;
      } else if (code === 200) {
        galleryList = []; galleryLoaded = true;
      }
      drawGallery();
      if (cb) cb(code === 200 ? galleryList : null);
    });
  }

  function refreshGallery() { loadGallery(null); }

  function drawGallery() {
    var box = $('thumbs');
    clear(box);
    var shown = Math.min(galleryList.length, st.limit);
    for (var i = 0; i < shown; i++) {
      (function (item, idx) {
        var cell = document.createElement('div');
        cell.className = 't';
        var a = document.createElement('a');
        a.href = item.url;
        a.title = item.name;
        var img = document.createElement('img');
        img.src = item.url;
        img.alt = item.name;
        a.appendChild(img);
        a.onclick = function () { openLb(idx, a); return false; };
        cell.appendChild(a);
        box.appendChild(cell);
      })(galleryList[i], i);
    }
    text($('gcount'), galleryList.length ? '(' + galleryList.length + ')' : '');
    show('none', !galleryList.length);
    show('more', galleryList.length > shown, 'inline-block');
  }

  function when(sec) {
    try { return new Date(sec * 1000).toLocaleString(); } catch (e) { return ''; }
  }

  function showLb(i) {
    var n = galleryList.length;
    if (!n) { closeLb(); return; }
    if (i < 0) i = 0;
    if (i > n - 1) i = n - 1;
    st.lb = i;
    var it = galleryList[i];
    $('lb-img').src = it.url;
    $('lb-img').alt = it.name;
    var dl = $('lb-dl');
    dl.href = it.url;
    dl.setAttribute('download', it.name);
    $('lb-open').href = it.url;
    text($('lb-title'), (i + 1) + ' / ' + n + ' · ' + it.name + ' · ' + Math.round(it.size / 1024) + ' KB · ' + when(it.created));
    $('lb-prev').disabled = i <= 0;
    $('lb-next').disabled = i >= n - 1;
  }

  function openLb(i, from) {
    lbFrom = from || null;
    showLb(i);
    show('lb', true, 'flex');
    $('lb-close').focus();
  }

  function closeLb() {
    show('lb', false);
    st.lb = -1;
    $('lb-img').removeAttribute('src');
    if (lbFrom) { try { lbFrom.focus(); } catch (e) {} }
  }

  function lbStep(d) {
    showLb(st.lb + d);
    var b = d < 0 ? $('lb-prev') : $('lb-next');
    if (b.disabled) $('lb-close').focus();
  }

  function onKey(e) {
    e = e || window.event;
    var k = e.keyCode;
    if (st.lb >= 0) {
      if (k === 27) { closeLb(); return false; }
      if (k === 37) { lbStep(-1); return false; }
      if (k === 39) { lbStep(1); return false; }
      if (k === 9) {
        // keep Tab inside the viewer
        var ring = [$('lb-prev'), $('lb-dl'), $('lb-open'), $('lb-close'), $('lb-next')];
        var live = [];
        for (var i = 0; i < ring.length; i++) if (!ring[i].disabled) live.push(ring[i]);
        var at = -1;
        for (var j = 0; j < live.length; j++) if (live[j] === document.activeElement) at = j;
        var to = e.shiftKey ? (at <= 0 ? live.length - 1 : at - 1) : (at < 0 || at >= live.length - 1 ? 0 : at + 1);
        live[to].focus();
        return false;
      }
    }
    return true;
  }

  // ---------- server info ----------
  function loadInfo() {
    if (st.infoBusy) return;
    st.infoBusy = true;
    req('GET', '/sdapi/v1/samplers', null, function (c1, samplers) {
      req('GET', '/sdapi/v1/schedulers', null, function (c2, schedulers) {
        req('GET', '/sdcpp/v1/capabilities', null, function (c3, caps) {
          st.useJobs = false;
          if (c3 === 200 && caps) {
            var modes = caps.supported_modes || [];
            for (var i = 0; i < modes.length; i++) if (modes[i] === 'img_gen') st.useJobs = true;
            st.canCancelGen = !!(caps.features && caps.features.cancel_generating);
          }
          fill($('sampler'), names(samplers));
          fill($('scheduler'), names(schedulers));
          modelName(function (name, reachable) {
            st.infoBusy = false;
            if (!reachable) { setOnline(false); return; }
            text($('model'), name || 'no model loaded');
            applyModel(name);
            resume();
          });
        });
      });
    });
  }

  function modelName(cb) {
    req('GET', '/sdapi/v1/sd-models', null, function (code, data) {
      var name = '';
      if (code === 200 && data && data.length) name = data[0].model_name || data[0].title || data[0].filename || '';
      if (name || code === 0) { cb(name, code !== 0); return; }
      req('GET', '/v1/models', null, function (c, d) {
        var n = '';
        if (c === 200 && d && d.data && d.data.length) n = d.data[0].id;
        cb(n, c !== 0);
      });
    });
  }

  // Cheap check every few seconds: is the server there, and is someone else using it?
  function health() {
    if (st.busy) { setTimeout(health, 4000); return; }
    req('GET', '/sdapi/v1/progress', null, function (code, data) {
      if (!st.busy) {
        if (code === 0) {
          st.offFails++;
          if (st.offFails >= 2) setOnline(false);
        } else {
          var s = data && data.state;
          st.others = !!(s && (s.job_count > 0 || s.sampling_steps > 0));
          setOnline(true);
          setPill();
        }
      }
      setTimeout(health, st.online ? 4000 : 3000);
    }, 6000);
  }

  // ---------- start up ----------
  function init() {
    buildPresets();
    var v = load('prompt'); if (v !== null) $('prompt').value = v;
    v = load('neg'); if (v !== null) $('neg').value = v;
    applyModel('');
    st.model = null;
    var fields = ['prompt', 'neg', 'w', 'h', 'steps', 'cfg', 'seed', 'sampler', 'scheduler'];
    for (var i = 0; i < fields.length; i++) {
      $(fields[i]).onchange = $(fields[i]).oninput = persist;
    }
    $('w').onchange = $('h').onchange = $('w').oninput = $('h').oninput = function () { markPreset(); persist(); };
    $('steps-').onclick = function () { stepper('steps', -1, 1, 150, 0); };
    $('steps+').onclick = function () { stepper('steps', 1, 1, 150, 0); };
    $('cfg-').onclick = function () { stepper('cfg', -0.5, 0, 30, 1); };
    $('cfg+').onclick = function () { stepper('cfg', 0.5, 0, 30, 1); };
    $('rnd').onclick = function () { $('seed').value = -1; persist(); };
    $('go').onclick = generate;
    $('cancel').onclick = cancel;
    $('surprise').onclick = function () {
      $('prompt').value = SURPRISE[Math.floor(Math.random() * SURPRISE.length)];
      persist();
    };
    $('prompt').onkeydown = function (e) {
      e = e || window.event;
      if (e.keyCode === 13 && (e.ctrlKey || e.metaKey)) { generate(); return false; }
      return true;
    };
    $('set-toggle').onclick = toggleSettings;
    if (load('open') === '1') toggleSettings();
    $('resetpreset').onclick = function () {
      var seed = $('seed').value;
      setForm(st.preset);
      $('seed').value = seed;
      persist();
      toast('Preset applied.');
    };
    $('tab-create').onclick = function () { setView('create'); };
    $('tab-gallery').onclick = function () { setView('gallery'); };
    $('more').onclick = function () { st.limit += PAGE; drawGallery(); };
    $('refresh').onclick = refreshGallery;
    $('lb-close').onclick = closeLb;
    $('lb-prev').onclick = function () { lbStep(-1); };
    $('lb-next').onclick = function () { lbStep(1); };
    document.onkeydown = onKey;
    markPreset();
    summary();
    setPill();
    health();
    loadGallery(null);
  }

  init();
})();
</script>
</body>
</html>
